# نشر ثابت بالكامل: المحرّك يعمل في متصفّح المستخدم، فلا خادم ولا واجهة
# برمجية — وهذا يعني أيضاً أن مدخلات المستثمر لا تغادر جهازه.
[build]
  command = "npm install && npm run build --workspace @investreal/web"
  publish = "apps/web/out"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
